name: pull request

on:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    name: build
    steps:

      - name: check out code
        uses: actions/checkout@v7

      - name: install go
        uses: actions/setup-go@v7
        with:
          go-version: '1.26.0'
          cache: true

      - name: normalize go modules
        run: go mod tidy

      - name: prepare build environment
        run: |
          # Create Binary Directory
          mkdir -p bin
          curl -L -o bin/operator-sdk https://github.com/operator-framework/operator-sdk/releases/download/v1.42.3/operator-sdk_linux_amd64
          make controller-gen
          make kustomize
          echo bin >> $GITHUB_PATH
          chmod +x bin/*

      - name: run controller tests
        shell: bash
        run: make test

      - name: build code
        shell: bash
        run: make build

      - name: verify default Bitcoin runtime image
        run: docker pull ghcr.io/btcsuite/btcd:v0.26.2

      - name: build operator image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./${{ env.PROJECT_DIR }}/Dockerfile
          push: false
          tags: |
            quay.io/kiln-fired/kiln-operator:latest

      - name: build bundle
        shell: bash
        run: make bundle IMG=quay.io/kiln-fired/kiln-operator:latest VERSION=0.0.1 DEFAULT_CHANNEL=alpha

      - name: build bundle image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./${{ env.PROJECT_DIR }}/bundle.Dockerfile
          push: false
          tags: |
            quay.io/kiln-fired/kiln-operator-bundle:latest