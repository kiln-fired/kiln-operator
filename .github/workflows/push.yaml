name: main

on:
  push:
    branches:
      - main

concurrency:
  group: main-publish
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    name: build and publish
    steps:
      - name: check out code
        uses: actions/checkout@v7

      - name: install go
        uses: actions/setup-go@v7
        with:
          go-version: '1.26.0'
          cache: true
          cache-dependency-path: go.mod

      - name: normalize go modules
        run: go mod tidy

      - name: prepare build environment
        run: |
          mkdir -p bin
          curl -L -o bin/operator-sdk https://github.com/operator-framework/operator-sdk/releases/download/v1.42.3/operator-sdk_linux_amd64
          make controller-gen
          make kustomize
          echo bin >> $GITHUB_PATH
          chmod +x bin/*

      - name: run controller tests
        run: make test

      - name: build code
        run: make build

      - name: verify default Bitcoin runtime image
        run: docker pull ghcr.io/btcsuite/btcd:v0.26.2

      - name: authenticate to container image registry
        uses: docker/login-action@v4
        with:
          registry: quay.io
          username: ${{ secrets.QUAY_USERNAME }}
          password: ${{ secrets.QUAY_PASSWORD }}

      - name: publish operator image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: quay.io/kiln-fired/kiln-operator:latest

      - name: build bundle
        run: make bundle IMG=quay.io/kiln-fired/kiln-operator:latest VERSION=0.0.1 DEFAULT_CHANNEL=alpha

      - name: publish bundle image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./bundle.Dockerfile
          push: true
          tags: quay.io/kiln-fired/kiln-operator-bundle:latest
