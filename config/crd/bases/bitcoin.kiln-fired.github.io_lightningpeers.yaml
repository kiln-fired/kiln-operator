        description: LightningPeer is the Schema for durable LND peer connectivity.
        properties:
          apiVersion:
            description: APIVersion defines the versioned schema of this representation of an object.
            type: string
          kind:
            description: Kind is a string value representing the REST resource this object represents.
            type: string
          metadata:
            type: object
          spec:
            description: LightningPeerSpec defines a desired persistent peer connection for an LND node.
            properties:
              address:
                description: Network address used when establishing the peer connection, for example example.com:9735, 203.0.113.10:9735, or an onion address.
