                - message: nodeRef is immutable
                  rule: self == oldSelf
              pubkey:
                description: Compressed secp256k1 public key of the remote Lightning node.
                pattern: ^[0-9a-fA-F]{66}$
                type: string
                x-kubernetes-validations:
                - message: pubkey is immutable
                  rule: self == oldSelf
            required:
            - address
            - nodeRef
            - pubkey
            type: object
          status:
            description: LightningPeerStatus describes the observed LND peer connection.
            properties:
              conditions:
                description: Conditions summarize node dependency and peer connection state.
                items:
                  description: Condition contains details for one aspect of the current state of this API Resource.
