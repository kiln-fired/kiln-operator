---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.22.0
  creationTimestamp: null
  name: lightningnodes.bitcoin.kiln-fired.github.io
spec:
  group: bitcoin.kiln-fired.github.io
  names:
    kind: LightningNode
    listKind: LightningNodeList
    plural: lightningnodes
    singular: lightningnode
  scope: Namespaced
  versions:
  - name: v1alpha1
    schema:
      openAPIV3Schema:
        description: LightningNode is the Schema for the lightningnodes API
        properties:
          apiVersion:
            description: APIVersion defines the versioned schema of this representation of an object.
            type: string
          kind:
            description: Kind is a string value representing the REST resource this object represents.
            type: string
          metadata:
            type: object
          spec:
            description: LightningNodeSpec defines the desired state of LightningNode
            properties:
              bitcoinConnection:
                description: Configuration for the Bitcoin RPC client
                properties:
                  external:
                    description: Explicit connection to an externally managed btcd node.
                    properties:
                      apiAuthSecretName:
                        description: Name of the Secret containing Bitcoin RPC API credentials.
                        minLength: 1
                        type: string
                      apiPasswordSecretKey:
                        description: Secret key containing the Bitcoin RPC password.
                        minLength: 1
                        type: string
                      apiUserSecretKey:
                        description: Secret key containing the Bitcoin RPC username.
                        minLength: 1
                        type: string
                      certSecret:
                        description: Name of the Secret containing the Bitcoin RPC TLS certificate.
                        minLength: 1
                        type: string
                      host:
                        description: Hostname of the externally managed Bitcoin RPC endpoint.
                        minLength: 1
                        type: string
                      network:
                        description: Bitcoin network used by the external backend.
                        enum:
                        - simnet
                        - testnet
                        - regtest
                        - signet
                        - mainnet
                        type: string
                    required:
                    - apiAuthSecretName
                    - apiPasswordSecretKey
                    - apiUserSecretKey
                    - certSecret
                    - host
                    - network
                    type: object
                  nodeRef:
                    description: Name of a BitcoinNode in the same namespace. Kiln derives network, RPC endpoint, TLS Secret, and API credential Secret from the referenced node.
                    minLength: 1
                    type: string
                type: object
                x-kubernetes-validations:
                - message: exactly one of nodeRef or external must be configured
                  rule: (has(self.nodeRef) && !has(self.external)) || (!has(self.nodeRef) && has(self.external))
              image:
                default:
                  lndImage: docker.io/lightninglabs/lnd:v0.21.0-beta
                  lndInitImage: docker.io/lightninglabs/lndinit:v0.1.36-beta-lnd-v0.21.0-beta
                description: Container image overrides
                properties:
                  lndImage:
                    default: docker.io/lightninglabs/lnd:v0.21.0-beta
                    description: LND container image
                    type: string
                  lndInitImage:
                    default: docker.io/lightninglabs/lndinit:v0.1.36-beta-lnd-v0.21.0-beta
                    description: lnd-init container image
                    type: string
                type: object
              rpc:
                description: RPC client credential publishing configuration
                properties:
                  secretName:
                    description: Name of the Secret that receives LND client credentials. Defaults to <lightningNode name>-rpc.
                    type: string
                type: object
              safety:
                description: Safety policy for network-sensitive behavior.
                properties:
                  allowMainnet:
                    default: false
                    description: AllowMainnet must be explicitly set to true before Kiln will start a mainnet node.
                    type: boolean
                type: object
              wallet:
                description: Configuration for the wallet
                properties:
                  password:
                    description: Wallet password
                    properties:
                      secretKey:
                        description: Name of the secret key that contains the wallet password
                        type: string
                      secretName:
                        description: Name of the secret that contains the Lightning wallet password
                        type: string
                    type: object
                  seed:
                    description: Seed to import to the wallet
                    properties:
                      mnemonicKey:
                        default: mnemonic
                        description: Name of the secret key that contains the mnemonic seed
                        type: string
                      passphraseKey:
                        default: passphrase
                        description: Name of the secret key that contains the seed passphrase
                        type: string
                      secretName:
                        description: Name of the secret that contains the seed to import
                        type: string
                    type: object
                type: object
            type: object
          status:
            description: LightningNodeStatus defines the observed state of LightningNode
            properties:
              conditions:
                description: Conditions summarize dependency, wallet, credential, storage, and readiness state.
                items:
                  description: Condition contains details for one aspect of the current state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: lastTransitionTime is the last time the condition transitioned from one status to another.
                      format: date-time
                      type: string
                    message:
                      description: message is a human readable message indicating details about the transition.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: observedGeneration represents the .metadata.generation that the condition was set based upon.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: reason contains a programmatic identifier indicating the reason for the condition's last transition.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*\/)?(([A-Z]([a-z0-9]*[A-Z0-9])*)|([a-z0-9]([a-z0-9]*[A-Z0-9])*))$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              network:
                description: Network is the resolved Bitcoin network used by LND.
                type: string
              phase:
                description: Phase is a concise summary of the current lifecycle state.
                type: string
              rpcAddress:
                description: RPCAddress is the in-cluster LND RPC endpoint.
                type: string
              rpcSecretName:
                description: Name of the Secret containing published LND client credentials.
                type: string
              runtime:
                description: Runtime contains authenticated observations from LND GetInfo.
                properties:
                  alias:
                    description: Alias is the node alias reported by LND.
                    type: string
                  blockHeight:
                    description: BlockHeight is LND's current best block height.
                    format: int32
                    type: integer
                  identityPubkey:
                    description: IdentityPubkey is the persistent LND node identity.
                    type: string
                  numActiveChannels:
                    format: int32
                    type: integer
                  numInactiveChannels:
                    format: int32
                    type: integer
                  numPeers:
                    format: int32
                    type: integer
                  numPendingChannels:
                    format: int32
                    type: integer
                  syncedToChain:
                    description: SyncedToChain reports whether the wallet is synchronized with Bitcoin.
                    type: boolean
                  syncedToGraph:
                    description: SyncedToGraph reports whether LND considers its public graph synchronized.
                    type: boolean
                  version:
                    description: Version is the running LND version.
                    type: string
                type: object
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
